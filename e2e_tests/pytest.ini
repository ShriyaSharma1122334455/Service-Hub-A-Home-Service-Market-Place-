[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
log_cli = true
log_cli_level = INFO
markers =
    auth: Authentication and session tests
    customer: Customer-specific UI flows
    provider: Provider-specific UI flows
    profile: Profile and account tests
    api: Direct backend API tests
    navigation: Routing and navigation tests
    smoke: Quick smoke tests covering critical paths
